# Host Nginx Configuration for athoscollagen.com
# Location on VPS: /etc/nginx/sites-available/athoscollagen.com

server {
    listen 80;
    listen [::]:80;
    server_name athoscollagen.com www.athoscollagen.com;

    # Increase body size limit for file uploads if needed
    client_max_body_size 50M;

    location / {
        # Proxy traffic to the Athos Docker container running on port 8091
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
